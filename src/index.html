function transferirDlg(ids){
  if(!ids.length)return;
  const ctx={destCid:S.cid,destSinds:S.data.sindicatos,destSind:'',modo:'mover',obs:''};
  openModal({title:`Transferir ${ids.length} atleta${ids.length>1?'s':''}`,ctx,
   sync:(f,c)=>{const g=n=>f.elements[n]&&f.elements[n].value;c.destCid=g('destCid')||c.destCid;c.destSind=g('destSind')||'';c.modo=g('modo')||c.modo;c.obs=g('obs')||''},
   render:c=>`<p class="small muted">${ids.map(i=>esc(atl(i)?.nome)).slice(0,8).join(', ')}${ids.length>8?' e mais '+(ids.length-8):''}</p><div class="form">${F('Campeonato de destino','destCid',c.destCid,{options:optList(S.camps,'nome'),full:true}).replace('<select','<select data-chg="tr-camp"')}${F('Sindicato de destino','destSind',c.destSind,{required:true,options:optList(sortBy(c.destSinds,'nome'),'nome'),blank:'Selecione…'})}${c.destCid!==S.cid?F('Ao mudar de campeonato','modo',c.modo,{options:[['mover','Mover (sai deste campeonato)'],['copiar','Copiar (permanece neste)']]}):''}${F('Observação','obs',c.obs,{full:true})}</div>${c.destSinds.length?'':'<p class="badge warn">O campeonato de destino ainda não tem sindicatos.</p>'}`,
   onSubmit:async(fd,f,c)=>{
    const dc=fd.get('destCid'),ds=fd.get('destSind'),modo=fd.get('modo')||'mover',obs=fd.get('obs');
    const dn=c.destSinds.find(x=>x.id===ds)?.nome,dcn=byId(S.camps,dc)?.nome,hoje=new Date().toISOString().slice(0,10);
    for(const id of ids){
      const a=atl(id);if(!a)continue;
      const hist=[...(a.historico||[]),{data:hoje,de:sind(a.sindicatoId)?.nome||'',para:dn,camp:dc!==S.cid?dcn:'',obs}];
      const insc=S.data.inscricoes.filter(i=>i.atletaId===id);
      if(dc===S.cid){
        await patch('atletas',id,{sindicatoId:ds,historico:hist});
        await lote(insc,i=>{const ct=cat(i.categoriaId);if(ct&&!ind(ct)&&!(ct.sindicatos||[]).includes(ds))return rem('inscricoes',i.id);return patch('inscricoes',i.id,{sindicatoId:ds})});
      }else{
        const{id:_,...r}=a;await put('atletas',id,{...r,sindicatoId:ds,historico:hist},dc);
        if(modo==='mover'){await lote(insc,i=>rem('inscricoes',i.id));await rem('atletas',id)}
      }
      S.ui.sel.delete(id);
    }
    toast('Transferência concluída.');
   }});
}

let RANK=RANK0,rankSub=false;
function subRank(){if(rankSub||!S.db)return;rankSub=true;
  S.db.collection('ranking').onSnapshot(sn=>{const d=sn.docs.find(x=>x.id==='principal');const v=d&&d.data();RANK=v&&Array.isArray(v.cats)&&Array.isArray(v.anos)?v:RANK0;paint()},e=>console.warn('ranking',e))}
const rkSalvar=async r=>{await guard(()=>S.db.collection('ranking').doc('principal').set(JSON.parse(JSON.stringify(r))));RANK=r;paint()};
const rkNk=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function rkNome(city,sg){const s=S.data.sindicatos.find(x=>rkNk(x.cidade)===rkNk(city));
  return s?esc(s.nome)+cidS(s):(sg?esc(String(sg).toUpperCase())+`<small class="cid"> - ${esc(city)}</small>`:esc(city))}
function rkLinhas(cats){const m=new Map();
  cats.forEach(c=>c.rows.forEach(r=>{const k=rkNk(r[0]);const o=m.get(k)||{city:r[0],sg:r[1],y:[0,0,0]};if(!o.sg)o.sg=r[1];o.y[0]+=r[2];o.y[1]+=r[3];o.y[2]+=r[4];m.set(k,o)}));
  return [...m.values()]}
function rkTabela(linhas){
  const L=linhas.map(l=>({...l,t:l.y[0]+l.y[1]+l.y[2]})).filter(l=>l.t>0).sort((a,b)=>b.t-a.t||b.y[2]-a.y[2]||b.y[1]-a.y[1]||b.y[0]-a.y[0]||a.city.localeCompare(b.city,'pt-BR'));
  if(!L.length)return '<p class="muted">Sem pontuação no período.</p>';
  return `<div class="tblwrap"><table><thead><tr><th class="n">Pos.</th><th>Sindicato</th>${RANK.anos.map(a=>`<th class="n">${a}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${L.map((l,i)=>`<tr><td class="n">${i+1}º</td><td>${rkNome(l.city,l.sg)}</td>${l.y.map(v=>`<td class="n">${v||'–'}</td>`).join('')}<td class="n"><b>${l.t}</b></td></tr>`).join('')}</tbody></table></div>`}
V.ranking=()=>{
  subRank();
  const mods=[...new Set(RANK.cats.map(c=>c.mod))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const f=S.ui.f,cur=f.rkm==='__geral'||mods.includes(f.rkm)?f.rkm:'__geral';
  const an=RANK.anos,intro=`<p class="small muted" style="margin:6px 0 12px">Pontos acumulados em ${an[0]}, ${an[1]} e ${an[2]}, por modalidade e categoria, na ordem de colocação. Em caso de empate no total, vale a pontuação do ano mais recente.</p>`;
  let corpo;
  if(cur==='__geral')corpo=`<section class="card stack"><h3>Ranking geral · todas as modalidades</h3>${rkTabela(rkLinhas(RANK.cats))}</section>`;
  else{const cs=RANK.cats.filter(c=>c.mod===cur);
    corpo=`<section class="card stack"><h3>${esc(cur)} · total da modalidade</h3>${rkTabela(rkLinhas(cs))}</section>${cs.map(c=>`<section class="card stack"><div class="row" style="justify-content:space-between"><h3>${esc(c.nome)}</h3>${S.isAdmin?btn('rk-edit','Editar pontos',`data-i="${RANK.cats.indexOf(c)}"`,'sm'):''}</div>${rkTabela(rkLinhas([c]))}</section>`).join('')}`}
  return `${bar('Ranking · últimos 3 anos',S.isAdmin?btn('rk-anos','Editar anos')+btn('rk-avancar','Avançar para '+(an[2]+1)):'')}${intro}${chips('rkm',[['__geral','Geral'],...mods.map(m=>[m,m])],cur)}<div class="stack" style="margin-top:14px">${corpo}</div>`};
A['rk-anos']=()=>openModal({title:'Editar anos do ranking',render:()=>`<div class="form">${RANK.anos.map((a,i)=>F('Ano '+(i+1),'a'+i,a,{type:'number',min:2000,required:true})).join('')}</div><p class="small muted">Altera só o título das colunas. Os pontos continuam nas mesmas colunas.</p>`,
  onSubmit:async fd=>{const an=[0,1,2].map(i=>+fd.get('a'+i));if(an.some(a=>!a||a<2000)){toast('Informe os três anos.',true);return false}
   if(new Set(an).size<3){toast('Os anos não podem se repetir.',true);return false}
   await rkSalvar({...RANK,anos:an});toast('Anos salvos.')}});
A['rk-avancar']=()=>{const an=RANK.anos,novo=an[2]+1;confirmar(`Avançar o ranking para ${an[1]}, ${an[2]} e ${novo}? O ano ${an[0]} sai e ${novo} começa com zero pontos. Você pode editar os pontos depois.`,async()=>{
  await rkSalvar({anos:[an[1],an[2],novo],cats:RANK.cats.map(c=>({...c,rows:c.rows.map(r=>[r[0],r[1],r[3],r[4],0]).filter(r=>r[2]||r[3]||r[4])}))});toast('Ranking avançado para '+novo+'.')},'Avançar')};
A['rk-edit']=d=>{const ci=+d.i,c=RANK.cats[ci];if(!c)return;
  const dels=[];const vis=new Set();
  sortBy(S.data.sindicatos,'nome').forEach(s=>{if(s.cidade&&String(s.cidade).trim()){dels.push({city:String(s.cidade).trim(),sg:s.nome});vis.add(rkNk(s.cidade))}});
  c.rows.forEach(r=>{if(!vis.has(rkNk(r[0]))){dels.push({city:r[0],sg:r[1]});vis.add(rkNk(r[0]))}});
  const val=(city,y)=>{const r=c.rows.find(x=>rkNk(x[0])===rkNk(city));return r?r[2+y]:0};
  openModal({title:'Pontos · '+c.nome,wide:true,render:()=>`<div class="tblwrap"><table><thead><tr><th>Sindicato</th>${RANK.anos.map(a=>`<th class="n">${a}</th>`).join('')}</tr></thead><tbody>${dels.map((x,i)=>`<tr><td>${rkNome(x.city,x.sg)}</td>${[0,1,2].map(y=>`<td class="n"><input type="number" min="0" step="1" name="p_${i}_${y}" value="${val(x.city,y)||''}" style="width:64px;text-align:center" aria-label="${esc(noMk(x.sg||x.city))} ${RANK.anos[y]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">Deixe em branco quem não pontuou.</p>`,
   onSubmit:async fd=>{const rows=[];dels.forEach((x,i)=>{const v=[0,1,2].map(y=>Math.max(0,+fd.get(`p_${i}_${y}`)||0));if(v.some(Boolean))rows.push([x.city,x.sg,...v])});
    const cats=RANK.cats.map((k,j)=>j===ci?{...k,rows}:k);await rkSalvar({...RANK,cats});toast('Pontos salvos.')}})};

   const titulo=(REL.find(x=>x[0]===k)||[])[1]||'Relatório';

   const head=r.grupos?[r.grupos.map(g=>({content:String(g.nome),colSpan:g.span||1,rowSpan:g.rows?2:1,styles:{halign:'center'}})),r.sub.map(x=>({content:String(x),styles:{halign:'center'}}))]:[r.cols.map(String)];
   doc.autoTable({head,body:r.rows.map(x=>x.map(v=>noMk(v))),startY:23,theme:'grid',styles:{fontSize:8,cellPadding:1.5,lineColor:[120,120,120],lineWidth:.1,textColor:[20,20,20]},headStyles:{fillColor:[18,69,58],textColor:[255,255,255]},didParseCell:h=>{if(h.section==='body'&&String(noMk(h.cell.raw)).startsWith(BRACO))h.cell.styles.fillColor=[201,240,207]}});

    <p class="small">Escolha os <b>11 melhores atletas</b> de ${SEL_LISTAS[l].nome}. <span class="muted">${n} atleta(s) candidato(s). Um voto por aparelho.</span></p>
    <div class="row">${j?'<span class="badge ok">Você já votou neste aparelho</span>':st.k==='ab'?btn('sel-votar','Votar',`data-l="${l}"`,'pri'):''}${S.isAdmin?btn('sel-config','Configurar prazo e categorias',`data-l="${l}"`,'sm'):''}</div>${res}</article>`}).join('');

A['sel-votar']=d=>{const l=d.l,st=selStatus(l);if(st.k!=='ab'){toast('A votação não está aberta.',true);return}if(selVotou(l)){toast('Você já votou neste aparelho.',true);return}
  const cand=selCand(l);if(cand.length<11){toast('Não há atletas candidatos suficientes. O administrador precisa definir as categorias.',true);return}
  const gr={};cand.forEach(a=>{(gr[a.sindicatoId]=gr[a.sindicatoId]||[]).push(a)});const ss=Object.keys(gr).sort((x,y)=>noMk(sind(x)?.sigla||'').localeCompare(noMk(sind(y)?.sigla||''),'pt-BR'));

   render:()=>`<p class="small muted">Marque exatamente <b>11 atletas</b>. Depois de confirmar, não é possível votar de novo neste aparelho.</p><div class="row" style="position:sticky;top:0;background:var(--surface);padding:6px 0;z-index:1"><b id="sel_cont">0/11</b><input type="search" id="sel_q" placeholder="Buscar atleta…" style="flex:1 1 160px" aria-label="Buscar atleta"></div>${ss.map(sid=>`<details open data-sg><summary><b>${esc(noMk(sind(sid)?.sigla||sind(sid)?.nome||'—'))}</b></summary><div class="cols" style="padding:6px 0">${gr[sid].map(a=>`<label class="panm" data-n="${esc(nkS(a.nome))}"><input type="checkbox" name="a" value="${a.id}"><span class="nm">${esc(a.nome)}</span></label>`).join('')}</div></details>`).join('')}`,
   onchange:e=>{const f=$('#mform');if(!f)return;if(e.target.id==='sel_q'){return}const ck=[...f.querySelectorAll('input[name=a]')],n=ck.filter(i=>i.checked).length;
     if(n>11&&e.target.name==='a'){e.target.checked=false;toast('Máximo de 11 atletas.',true)}const m=ck.filter(i=>i.checked).length;$('#sel_cont').textContent=m+'/11'},
   onSubmit:async fd=>{const ids=fd.getAll('a');if(ids.length!==11){toast('Marque exatamente 11 atletas (marcados: '+ids.length+').',true);return false}
    if(selVotou(l)){toast('Você já votou neste aparelho.',true);return false}
    const{error}=await sb.rpc('votar_selecao',{p_cid:S.cid,p_lista:l,p_device:selDev(),p_atletas:ids});
    if(error){const m=String(error.message||'');if(/ja_votou/.test(m)){try{localStorage.setItem('jocopar_voto_'+S.cid+'_'+l,'1')}catch(e){}toast('Este aparelho já votou nesta lista.',true)}else if(/fora_do_prazo/.test(m))toast('A votação não está aberta.',true);else toast('Não foi possível registrar o voto. Confira se o arquivo 18_selecao_copa.sql foi executado.',true);return false}
    try{localStorage.setItem('jocopar_voto_'+S.cid+'_'+l,'1')}catch(e){}S.selT=0;toast('Voto registrado. Obrigado!');paint()}});
  const q=$('#sel_q');if(q)q.addEventListener('input',()=>{const t=nkS(q.value);document.querySelectorAll('#mform label[data-n]').forEach(x=>{x.style.display=!t||x.dataset.n.includes(t)?'':'none'})})};

A['mid-novo']=()=>{
  if(S.isAdmin)return midAdmin();
  openModal({title:'Enviar fotos e vídeos',sem:true,submit:'Enviar',render:()=>`<div class="form">${F('Seu nome','remetente','',{required:true,full:true})}${F('Título (opcional)','titulo','',{full:true})}<label class="f full">Fotos ou vídeos (até 20 MB cada, no máximo 10)<input type="file" name="arquivos" multiple accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label></div><p class="small muted">Depois do envio, o administrador analisa e publica.</p>`,
   onSubmit:async fd=>{const fs=fd.getAll('arquivos').filter(f=>f&&f.size);if(!fs.length){toast('Escolha ao menos um arquivo.',true);return false}
    if(fs.length>10){toast('Envie no máximo 10 arquivos por vez.',true);return false}

      if(f.size>20*1048576){toast(`${f.name}: grande demais (máx. 20 MB).`,true);continue}
      const ext=f.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,''),path='pendentes/'+nid()+nid()+'.'+ext;
      const up=await sb.storage.from('arquivos').upload(path,f,{contentType:f.type||undefined,upsert:false});
      if(up.error){toast(`Não foi possível enviar ${f.name}.`,true);continue}
      const r=await sb.from('midias_pendentes').insert({cid:S.cid,path,nome_arquivo:f.name.slice(0,200),tipo:(f.type||'').slice(0,60),titulo:(fd.get('titulo')||'').trim().slice(0,120),remetente:rem.slice(0,100)});
      if(r.error){toast(`Não foi possível registrar ${f.name}.`,true);continue}ok++}

  const sopt=soptDe(vv&&vv.categoria_id);

  const reLista=()=>{const f=$('#mform'),box=f&&f.querySelector('#re_lista');if(!box||tipo==='jogo')return;

    const val=(a,k)=>{const n=k+'_'+a.id;if(keep[n]!=null)return keep[n];const l=edL(a);if(!l)return '';return k==='t'?(l.tempo||''):(l['p'+k.slice(1)]??'')};
    const row=a=>tipo==='pinos'?`<div class="item pn"><div class="main"><b>${esc(a.nome)}</b></div>${['1','2'].map(k=>`<label class="pnl">${k}ª<input type="number" min="0" max="180" step="1" inputmode="numeric" name="p${k}_${a.id}" value="${esc(val(a,'p'+k))}" aria-label="${esc(a.nome)} ${k}ª passada"></label>`).join('')}</div>`
      :`<div class="item"><div class="main"><b>${esc(a.nome)}</b></div><input name="t_${a.id}" value="${esc(val(a,'t'))}" placeholder="hh:mm:ss" maxlength="11" style="width:130px" aria-label="Tempo de ${esc(a.nome)}"></div>`;

    box.innerHTML=`<b class="small">Atletas inscritos de ${esc(noMk(sTxt(sind(sa))))} (${ins.length})</b><div class="stack" style="margin:6px 0">${ins.length?ins.map(row).join(''):'<p class="muted small">Nenhum atleta inscrito neste sindicato nesta categoria.</p>'}</div>`
      +(nao.length?`<details${naoAb||!ins.length?' open':''}><summary class="small"><b>Atletas não inscritos neste sindicato (${nao.length})</b> · preencha para incluir</summary><div class="stack" style="margin-top:6px">${nao.map(row).join('')}</div></details>`:'')};
  openModal({title:(ed?'Alterar envio · ':'Enviar · ')+RE_TIPOS[tipo],sem:true,submit:ed?'Salvar alteração':'Enviar para aprovação',wide:tipo==='pinos',
   onchange:e=>{if(tipo==='jogo'||!['sa','cat'].includes(e.target.name))return;const f=$('#mform');
     if(e.target.name==='cat'){const sel=f.elements.sa,atual=sel.value,op=soptDe(e.target.value);sel.innerHTML='<option value="">'+(e.target.value&&!op.length?'Nenhum sindicato participante nesta categoria':'Selecione…')+'</option>'+op.map(([v,t])=>`<option value="${esc(v)}"${v===atual?' selected':''}>${esc(t)}</option>`).join('');if(!op.some(x=>x[0]===atual))sel.value=''}
     reLista()},
   render:()=>`<div class="form">${tipo==='jogo'?`${selS('Sindicato','sa')}${F('Gols/pontos do 1º','pa',ed?ed.placar_a:'',{type:'number',min:0,required:true})}${selS('x Sindicato','sb')}${F('Gols/pontos do 2º','pb',ed?ed.placar_b:'',{type:'number',min:0,required:true})}`:''}
   ${F('Modalidade/Categoria','cat',vv?vv.categoria_id:'',{required:true,full:true,options:cats.map(c=>[c.id,catNome(c)]),blank:'Selecione…'})}${tipo!=='jogo'?selS('Sindicato (só os participantes da categoria)','sa'):''}${tipo==='tempos'?'':F('Grupo (opcional)','grupo',vv?vv.grupo||'':'')}
   ${tipo==='tempos'?F('Fase','fase',ed&&ed.linhas&&ed.linhas[0]&&ed.linhas[0].fase?FASES.indexOf(ed.linhas[0].fase):FASES.length-1,{options:FASES.map((f,k)=>[k,f])}):''}${tipo!=='jogo'?'<div class="full" id="re_lista"></div>':''}
   ${F('Enviado por','por',ed?ed.enviado_por:'',{required:true,full:true})}</div><p class="small muted">${tipo==='jogo'?'':'Ao escolher a categoria e o sindicato, aparecem os atletas inscritos. Preencha só os que participaram; se houver atleta que não está inscrito, abra a lista “não inscritos” e inclua.'}</p><p class="small muted">O resultado só vale depois que o administrador aprovar.</p>`,
   onSubmit:async fd=>{const c=cat(fd.get('cat')),sn=id=>sTxt(sind(id));
    if(!c){toast('Escolha a modalidade/categoria.',true);return false}
    const r={tipo,cid:S.cid,categoria_id:c.id,categoria:catNome(c).slice(0,160),grupo:(fd.get('grupo')||'').trim().slice(0,60)||null,sind_a:fd.get('sa'),sind_a_nome:sn(fd.get('sa')).slice(0,120),enviado_por:fd.get('por').trim().slice(0,100)};
    if(!r.sind_a||r.enviado_por.length<2){toast('Preencha os campos obrigatórios.',true);return false}
    if(tipo==='jogo'){if(!fd.get('sb')||fd.get('sb')===fd.get('sa')){toast('Escolha dois sindicatos diferentes.',true);return false}
      r.sind_b=fd.get('sb');r.sind_b_nome=sn(fd.get('sb')).slice(0,120);r.placar_a=+fd.get('pa');r.placar_b=+fd.get('pb')}
    const insc=new Set(atlsDe(c.id,r.sind_a).map(a=>a.id));
    if(tipo==='pinos'){const ln=[];for(const [k] of fd.entries()){if(!k.startsWith('p1_'))continue;const id=k.slice(3),a0=atl(id);if(!a0)continue;const a=String(fd.get('p1_'+id)||'').trim(),b=String(fd.get('p2_'+id)||'').trim();
        if(a===''&&b==='')continue;
        if((+a||0)>180||(+b||0)>180){toast(a0.nome+': máximo de 180 pinos por passada ('+((+a||0)>180?'1ª':'2ª')+' passada com '+Math.max(+a||0,+b||0)+'). Altere o valor.',true);return false}
        ln.push({atleta:a0.nome,aid:id,novo:!insc.has(id),p1:a===''?null:+a,p2:b===''?null:+b})}
      if(!ln.length){toast('Informe os pinos (1ª e/ou 2ª passada) de ao menos um atleta.',true);return false}
      r.linhas=ln;r.atleta=ln.map(x=>x.atleta).join(', ').slice(0,120);r.valor=String(ln.reduce((t,x)=>t+(x.p1||0)+(x.p2||0),0))}
    if(tipo==='tempos'){const fase=FASES[+fd.get('fase')]||FASES[FASES.length-1],ln=[];for(const [k] of fd.entries()){if(!k.startsWith('t_'))continue;const id=k.slice(2),a0=atl(id);if(!a0)continue;const t=String(fd.get(k)||'').trim().replace('.',',');if(t==='')continue;
        if(tSeg(t)==null){toast(a0.nome+': tempo inválido. Use hh:mm:ss, por exemplo 00:01:25,30.',true);return false}
        ln.push({atleta:a0.nome,aid:id,novo:!insc.has(id),tempo:tNorm(t),fase})}
      if(!ln.length){toast('Informe o tempo de ao menos um atleta.',true);return false}
      r.linhas=ln;r.grupo=fase;r.atleta=ln.map(x=>x.atleta).join(', ').slice(0,120);r.valor=ln.length===1?ln[0].tempo:ln.length+' tempos'}
    if(ed){const{data,error}=await sb.rpc('re_alterar',{p_id:ed.id,p_token:ed.token,p:r});
      if(error||!data){toast('Este envio não pode mais ser alterado (já foi analisado pelo administrador).',true);return false}
      guardaRes({...r,id:ed.id,token:ed.token});S.resT=0;await carregarRes();toast('Envio alterado.');return}
    const id=uuid(),token=uuid();
    const{error}=await sb.from('resultados_enviados').insert({...r,id,token});
    if(error){toast('Não foi possível enviar. Confira os dados.',true);return false}
    if(!S.isAdmin)guardaRes({...r,id,token});S.resT=0;await carregarRes();toast('Resultado enviado. Aparece como válido depois que o administrador aprovar.')}});reLista()};
A['re-meu-edit']=d=>A['re-novo']({id:d.id});
A['re-meu-del']=d=>{const m=meusRes().find(x=>x.id===d.id);if(!m)return;confirmar('Excluir este envio? Só é possível enquanto o administrador não analisou.',async()=>{const{data,error}=await sb.rpc('re_excluir',{p_id:m.id,p_token:m.token});
  if(error||!data){toast('Este envio não pode mais ser excluído (já foi analisado pelo administrador).',true);return}tiraRes(m.id);S.resT=0;await carregarRes();toast('Envio excluído.')},'Excluir')};
const reMuda=async(id,st,msg)=>{const{error}=await sb.from('resultados_enviados').update({status:st,decidido_em:new Date().toISOString()}).eq('id',id);if(error){toast('Não foi possível atualizar.',true);return false}S.resT=0;await carregarRes();toast(msg);return true};
A['re-aprovar']=d=>{reMuda(d.id,'aprovado','Resultado aprovado.')};
A['re-recusar']=d=>confirmar('Recusar este resultado? Ele continua guardado no banco de dados como Recusado.',async()=>{await reMuda(d.id,'recusado','Resultado recusado.')},'Recusar');
A['re-del']=d=>confirmar('Excluir definitivamente este envio do banco de dados?',async()=>{const{error}=await sb.from('resultados_enviados').delete().eq('id',d.id);if(error){toast('Não foi possível excluir.',true);return}S.resT=0;await carregarRes();toast('Envio excluído.')},'Excluir');
A['re-lancar']=d=>{const r=(S.res||[]).find(x=>x.id===d.id);if(!r)return;
  if(r.tipo==='pinos'||r.tipo==='tempos'){const c=cat(r.categoria_id);if(!c){toast('Categoria não encontrada.',true);return}
    const T=r.tipo==='tempos',al=atlsDe(c.id,r.sind_a),ok=[],fora=[];
    (r.linhas||[]).forEach(l=>{const n=nkS(l.atleta);const a=(l.aid&&atl(l.aid))||al.find(x=>nkS(x.nome)===n)||al.find(x=>nkS(x.nome).includes(n)||n.includes(nkS(x.nome)));if(a&&a.sindicatoId===r.sind_a)ok.push([a,l]);else fora.push(l.atleta)});
    if(!ok.length){toast('Nenhum atleta enviado foi encontrado neste sindicato.',true);return}
    const inscA=new Set(al.map(a=>a.id)),novos=ok.map(x=>x[0]).filter(a=>!inscA.has(a.id));
    const fi=T?FASES.indexOf((ok[0][1]||{}).fase||r.grupo):0;if(T&&fi<0){toast('Fase do envio não reconhecida. Lance manualmente em Jogos.',true);return}
    if(novos.length){const mx=+mod(c.modalidadeId)?.maxAtl||0;if(!T&&mx&&al.length+novos.length>mx){toast(`Passaria do máximo de ${mx} atletas por sindicato na categoria. Ajuste em Participantes antes.`,true);return}}
    confirmar(`Lançar ${T?'os tempos':'os pinos'} de ${ok.length} atleta(s) na categoria ${catNome(c)}?${novos.length?' Serão inscritos na categoria: '+novos.map(a=>a.nome).join(', ')+'.':''}${fora.length?' Não encontrados (não serão lançados): '+fora.join(', ')+'.':''} Os valores já lançados dos outros atletas são mantidos.`,async()=>{
      if(novos.length)await lote(novos,a=>put('inscricoes',`${c.id}__${a.id}`,{categoriaId:c.id,atletaId:a.id,sindicatoId:a.sindicatoId}));
      if(T){const dx=tempoDoc(c.id,fi),base={...((dx&&dx.tempos)||{})};ok.forEach(([a,l])=>{if(l.tempo)base[a.id]=l.tempo});

      const dx=byId(S.data.pinos,c.id),base={...((dx&&dx.pinos)||{})};let pass=(dx&&dx.passadas)||1;

      await put('pinos',c.id,{categoriaId:c.id,passadas:pass,pinos:base});await reMuda(r.id,'aprovado','Aprovado e lançado nos pinos da categoria.')},'Lançar');return}
  const js=S.data.jogos.filter(j=>j.categoriaId===r.categoria_id&&((j.a===r.sind_a&&j.b===r.sind_b)||(j.a===r.sind_b&&j.b===r.sind_a)));
  const abertos=js.filter(j=>j.status!=='encerrado');
  if(abertos.length!==1){toast(abertos.length?'Há mais de um jogo possível entre esses sindicatos. Lance o resultado manualmente em Jogos.':'Não encontrei um jogo em aberto entre esses sindicatos nessa categoria. Lance manualmente em Jogos.',true);return}
  const j=abertos[0],dir=j.a===r.sind_a,pa=dir?r.placar_a:r.placar_b,pb=dir?r.placar_b:r.placar_a;
  confirmar(`Lançar o placar ${pa} × ${pb} no jogo ${noMk(partNome(cat(j.categoriaId),j.a))} × ${noMk(partNome(cat(j.categoriaId),j.b))} e encerrá-lo?`,async()=>{await patch('jogos',j.id,{pa,pb,status:'encerrado'});await reMuda(r.id,'aprovado','Resultado aprovado e lançado no jogo.')},'Lançar')};

/* ---------- dados ao vivo ---------- */
let unsubs=[];
function subscribe(){
  unsubs.forEach(f=>f());unsubs=[];
  S.data=Object.fromEntries(COLS.map(c=>[c,[]]));
  if(!S.cid||!S.db)return;
  COLS.forEach(n=>unsubs.push(colRef(n).onSnapshot(s=>{S.data[n]=s.docs.map(d=>({id:d.id,...d.data()}));if(n==='sindicatos')S.data[n].forEach(x=>{const c=String(x.cidade||'').trim();x.sigla=x.nome+(c?'\uE000 - '+c+'\uE001':'')});paint()},e=>console.warn(n,e))));
}
function selCamp(id){const troca=!!S.cid&&S.cid!==id;S.cid=id;S.ui.sel.clear();if(troca)S.ui.f={};try{if(id)localStorage.setItem('jocopar-camp',id)}catch(e){}subscribe();paint()}
async function init(){
  paint();
  S.db=DBX;S.assets=ASSETS;S.dl=DLX;
  try{const{data}=await sb.auth.getSession();await aplicarSessao(data.session)}catch(e){console.warn(e);await aplicarSessao(null)}
  sb.auth.onAuthStateChange((ev,ses)=>{const uid=ses?ses.user.id:null;if(uid===S.uid)return;setTimeout(()=>aplicarSessao(ses).then(()=>{sbAll(true);paint()}),0)});
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
  window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TABS.some(t=>t[0]===x)&&x!==S.tab){S.tab=x;S.tabPedida=x;paint()}});
  DBX.collection('campeonatos').onSnapshot(s=>{
    S.camps=s.docs.map(d=>({id:d.id,...d.data()}));S.ready=true;
    if(!S.cid||!byId(S.camps,S.cid)){let last=null;try{last=localStorage.getItem('jocopar-camp')}catch(e){}
      const pick=byId(S.camps,last)||[...S.camps].sort((a,b)=>(b.ano||0)-(a.ano||0))[0];
      if(pick&&pick.id!==S.cid){selCamp(pick.id);return}if(!pick&&S.cid){selCamp(null);return}}
    paint();
  },e=>{S.ready=true;paint()});
}
init();

(function(){const el=document.getElementById('relogio');if(!el)return;const b=el.querySelector('b'),sm=el.querySelector('small');
  const tick=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');b.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());sm.textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})};
  tick();setInterval(tick,1000)})();
</script>
